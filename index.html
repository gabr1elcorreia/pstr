<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="Posture — 12 de novembro." />
  <title>Posture — 12 de novembro</title>

  <link rel="icon" type="image/png" href="https://i.imgur.com/sxvGNCE.png" />
  <link rel="apple-touch-icon" href="https://i.imgur.com/sxvGNCE.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #050505;
      --surface: rgba(255, 255, 255, 0.035);
      --line: rgba(255, 255, 255, 0.11);
      --text: #f4f4f2;
      --muted: rgba(244, 244, 242, 0.48);
      --soft: rgba(244, 244, 242, 0.72);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% -10%, rgba(255,255,255,.08), transparent 34%),
        radial-gradient(circle at 10% 90%, rgba(255,255,255,.035), transparent 30%),
        #050505;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .13;
      z-index: 10;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(22px, 4vw, 54px);
      position: relative;
      isolation: isolate;
    }

    .page::after {
      content: "";
      position: absolute;
      inset: clamp(12px, 2vw, 24px);
      border: 1px solid rgba(255,255,255,.055);
      pointer-events: none;
      z-index: -1;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .edition, .date-label {
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--soft);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .status::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 14px rgba(255,255,255,.55);
      animation: pulse 2.4s ease-in-out infinite;
    }

    main {
      display: grid;
      place-items: center;
      text-align: center;
      padding: 8vh 0 6vh;
    }

    .hero {
      width: min(100%, 850px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-wrap {
      position: relative;
      width: min(78vw, 560px);
      margin-bottom: clamp(42px, 8vh, 92px);
    }

    .logo-wrap::before {
      content: "";
      position: absolute;
      inset: 20% 8%;
      background: rgba(255,255,255,.07);
      filter: blur(60px);
      z-index: -1;
    }

    .logo {
      display: block;
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      filter: grayscale(1) contrast(1.08) brightness(1.04);
      animation: reveal 1.1s cubic-bezier(.2,.75,.25,1) both;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .32em;
      text-transform: uppercase;
    }

    .countdown {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: clamp(18px, 4vw, 46px);
      animation: reveal 1.1s .15s cubic-bezier(.2,.75,.25,1) both;
    }

    .unit {
      min-width: 58px;
      position: relative;
    }

    .number {
      display: block;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(28px, 5vw, 58px);
      line-height: 1;
      font-weight: 500;
      letter-spacing: -.05em;
      color: rgba(255,255,255,.92);
      font-variant-numeric: tabular-nums;
    }

    .label {
      display: block;
      margin-top: 10px;
      font-size: 8px;
      letter-spacing: .23em;
      text-transform: uppercase;
      color: rgba(255,255,255,.32);
    }

    .separator {
      padding-top: clamp(4px, 1.1vw, 11px);
      color: rgba(255,255,255,.16);
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(20px, 3vw, 36px);
    }

    .launch-date {
      margin: 30px 0 0;
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(255,255,255,.52);
      animation: reveal 1.1s .25s cubic-bezier(.2,.75,.25,1) both;
    }

    .socials {
      display: flex;
      gap: 10px;
    }

    .social-link {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 17px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--soft);
      text-decoration: none;
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      transition: border-color .25s ease, background .25s ease, color .25s ease, transform .25s ease;
      backdrop-filter: blur(8px);
    }

    .social-link:hover {
      color: #fff;
      border-color: rgba(255,255,255,.34);
      background: rgba(255,255,255,.08);
      transform: translateY(-2px);
    }

    .social-link svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(16px); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: .35; }
      50% { opacity: 1; }
    }

    @media (max-width:220px) {
      .page { padding: 24px; }
      .page::after { inset: 10px; }
      header { align-items: flex-start; }
      .edition { max-width: 130px; white-space: normal; line-height: 1.5; }
      main { padding: 8vh 0; }
      .logo-wrap { width: min(82vw, 400px); margin-bottom: 58px; }
      .countdown { gap: 15px; }
      .separator { display: none; }
      .unit { min-width: 54px; }
      footer { flex-direction: column-reverse; align-items: stretch; }
      .date-label { text-align: center; }
      .socials { display: grid; grid-template-columns: 1fr 1fr; }
      .social-link { padding: 0 12px; }
    }
  
.logo{
 animation:floatLogo 5s ease-in-out infinite,glowPulse 4s ease-in-out infinite;
 transform-origin:center;
 filter:drop-shadow(0 0 10px rgba(255,255,255,.08));
}
@keyframes floatLogo{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.02)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 10px rgba(255,255,255,.06))}50%{filter:drop-shadow(0 0 24px rgba(255,255,255,.18))}}

</style>
</head>
<body>
  <div class="page">
    <header>
      <span class="edition">GLOBAL CULTURE</span>
      <span class="status">Incoming</span>
    </header>

    <main>
      <section class="hero" aria-labelledby="launch-heading">
        <div class="logo-wrap">
          <img class="logo" class="logo" src="https://i.imgur.com/sxvGNCE.png" alt="Posture" />
        </div>

        <p class="eyebrow" id="launch-heading">Until the next chapter</p>

        <div class="countdown" aria-label="Contagem regressiva para 12 de novembro">
          <div class="unit"><span class="number" id="days">000</span><span class="label">Dias</span></div>
          <span class="separator">:</span>
          <div class="unit"><span class="number" id="hours">00</span><span class="label">Horas</span></div>
          <span class="separator">:</span>
          <div class="unit"><span class="number" id="minutes">00</span><span class="label">Min</span></div>
          <span class="separator">:</span>
          <div class="unit"><span class="number" id="seconds">00</span><span class="label">Seg</span></div>
        </div>

        <p class="launch-date">12.11.2026</p>
      </section>
    </main>

    <footer>
      <span class="date-label">Posture® 2026</span>
      <nav class="socials" aria-label="Contatos">
        <a class="social-link" href="https://www.instagram.com/pstr.company" target="_blank" rel="noopener noreferrer" aria-label="Instagram da Posture">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"/></svg>
          Instagram
        </a>
        <a class="social-link" href="mailto:contato@pstr.com.br" aria-label="Enviar e-mail para a Posture">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          E-mail
        </a>
      </nav>
    </footer>
  </div>

  <script>
    const target = new Date("2026-11-12T00:00:00-03:00").getTime();
    const refs = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds")
    };

    function updateCountdown() {
      const distance = Math.max(0, target - Date.now());
      const days = Math.floor(distance / 86400000);
      const hours = Math.floor((distance % 86400000) / 3600000);
      const minutes = Math.floor((distance % 3600000) / 60000);
      const seconds = Math.floor((distance % 60000) / 1000);

      refs.days.textContent = String(days).padStart(3, "0");
      refs.hours.textContent = String(hours).padStart(2, "0");
      refs.minutes.textContent = String(minutes).padStart(2, "0");
      refs.seconds.textContent = String(seconds).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
