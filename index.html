<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASCIDOS DO VAZIO</title>

    <link rel="icon" type="image/png" href="https://i.imgur.com/ntWCeDp.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --accent-glow: rgba(255,255,255,0.15);
            --pill-bg: rgba(8,8,8,0.82);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Space Grotesk', sans-serif;
            color: #fff;
        }

        /* CURSOR */

        .cursor-dot,
        .cursor-outline {
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
        }

        .cursor-dot {
            width: 6px;
            height: 6px;
            background: #fff;
        }

        .cursor-outline {
            width: 45px;
            height: 45px;
            border: 1px solid rgba(255,255,255,0.35);
            transition: .25s;
            mix-blend-mode: difference;
        }

        body.hovered .cursor-outline {
            width: 70px;
            height: 70px;
            background: var(--accent-glow);
            border-color: transparent;
        }

        /* BACKGROUND */

        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.88)),
                url('https://i.imgur.com/2fxxusm.png');
            background-size: cover;
            background-position: center;
            filter: grayscale(100%) contrast(120%);
            animation: slowZoom 18s ease-in-out infinite alternate;
        }

        @keyframes slowZoom {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.08);
            }
        }

        .noise-overlay {
            position: fixed;
            inset: 0;
            z-index: -2;
            opacity: .08;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.85) 100%);
        }

        /* NAV */

        .top-bar-container {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 620px;
            z-index: 10;
            animation: floatPill 6s ease-in-out infinite;
        }

        .nav-pill {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2.4rem;
            border-radius: 100px;
            background: var(--pill-bg);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .nav-links {
            display: flex;
            gap: 1.8rem;
            list-style: none;
            flex: 1;
            align-items: center;
        }

        .nav-links.right {
            justify-content: flex-end;
        }

        .nav-links a {
            color: #fff;
            opacity: .45;
            transition: .3s;
            text-decoration: none;
        }

        .nav-links a:hover {
            opacity: 1;
            transform: scale(1.15);
            filter: drop-shadow(0 0 8px #fff);
        }

        .nav-links i {
            font-size: 1.4rem;
        }

        .logo-center {
            margin: 0 1rem;
        }

        .logo-center img {
            height: 30px;
            filter: brightness(1.2);
            opacity: .9;
        }

        /* CONTENT */

        .content-center {
            position: absolute;
            top: 53%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            padding: 0 1.5rem;
        }

        .small-text {
            font-size: .7rem;
            letter-spacing: 10px;
            text-transform: uppercase;
            color: rgba(255,255,255,.35);
            margin-bottom: 2rem;
            display: block;
            font-weight: 700;
        }

        .main-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(3rem, 9vw, 8rem);
            font-weight: 800;
            line-height: .95;
            text-transform: uppercase;
            letter-spacing: -4px;
            margin-bottom: 2rem;
            background: linear-gradient(
                180deg,
                #ffffff 0%,
                rgba(255,255,255,.7) 50%,
                rgba(255,255,255,.12) 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: flicker 5s infinite;
        }

        @keyframes flicker {
            0%, 18%, 22%, 100% {
                opacity: 1;
            }

            20% {
                opacity: .75;
            }

            21% {
                opacity: .95;
            }
        }

        .date-box {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.8rem;
            border-radius: 100px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            margin-bottom: 3rem;
        }

        .date-box i {
            font-size: 1.2rem;
            opacity: .7;
        }

        .date-text {
            font-size: .9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255,255,255,.75);
        }

        .divider {
            width: 120px;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.5),
                transparent
            );
            margin: 0 auto;
        }

        footer {
            position: absolute;
            bottom: 2rem;
            width: 100%;
            text-align: center;
            font-size: .6rem;
            letter-spacing: 5px;
            opacity: .2;
        }

        @keyframes floatPill {
            0%,100% {
                transform: translateX(-50%) translateY(0);
            }

            50% {
                transform: translateX(-50%) translateY(10px);
            }
        }

        /* MOBILE */

        @media (max-width: 768px) {

            * {
                cursor: auto;
            }

            .cursor-dot,
            .cursor-outline {
                display: none;
            }

            .main-title {
                letter-spacing: -2px;
            }

            .small-text {
                letter-spacing: 6px;
            }

            .date-box {
                flex-direction: column;
                gap: .5rem;
                border-radius: 25px;
                padding: 1rem 1.2rem;
            }

            .date-text {
                font-size: .75rem;
                line-height: 1.5;
            }

            .nav-pill {
                padding: .8rem 1.5rem;
            }

            .nav-links i {
                font-size: 1.15rem;
            }

            .logo-center img {
                height: 24px;
            }
        }

    </style>
</head>

<body onclick="initAudio()">

    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_344933a39e.mp3?filename=dark-drone-ambient-14378.mp3" type="audio/mpeg">
    </audio>

    <div class="cursor-dot" data-cursor-dot></div>
    <div class="cursor-outline" data-cursor-outline></div>

    <div class="bg-layer"></div>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <div class="top-bar-container">
        <nav class="nav-pill">

            <ul class="nav-links left">
                <li>
                    <a href="https://pstr.com.br" class="hover-trigger">
                        <i class="ph ph-shopping-bag"></i>
                    </a>
                </li>

                <li>
                    <a href="https://instagram.com/posture.company" class="hover-trigger">
                        <i class="ph ph-instagram-logo"></i>
                    </a>
                </li>
            </ul>

            <div class="logo-center">
                <img src="https://i.imgur.com/07iSd3t.png" alt="POSTURE">
            </div>

            <ul class="nav-links right">
                <li>
                    <a href="mailto:contato@pstr.com.br" class="hover-trigger">
                        <i class="ph ph-envelope-simple"></i>
                    </a>
                </li>

                <li>
                    <a href="https://pstr.com.br" class="hover-trigger">
                        <i class="ph ph-arrow-up-right"></i>
                    </a>
                </li>
            </ul>

        </nav>
    </div>

    <main class="content-center">

        <span class="small-text">
            POSTURE PRESENTS
        </span>

        <h1 class="main-title">
            NASCIDOS<br>DO VAZIO
        </h1>

        <div class="date-box">
            <i class="ph ph-calendar-blank"></i>

            <span class="date-text">
                15/05/2026 às 18:00
            </span>
        </div>

        <div class="divider"></div>

    </main>

    <footer>
        POSTURE © 2026
    </footer>

    <script>

        // CURSOR

        const cursorDot = document.querySelector('[data-cursor-dot]');
        const cursorOutline = document.querySelector('[data-cursor-outline]');

        window.addEventListener('mousemove', (e) => {

            const posX = e.clientX;
            const posY = e.clientY;

            cursorDot.style.left = `${posX}px`;
            cursorDot.style.top = `${posY}px`;

            cursorOutline.animate({
                left: `${posX}px`,
                top: `${posY}px`
            }, {
                duration: 450,
                fill: "forwards"
            });

        });

        const triggers = document.querySelectorAll('.hover-trigger, a');

        triggers.forEach(trigger => {

            trigger.addEventListener('mouseenter', () => {
                document.body.classList.add('hovered');
            });

            trigger.addEventListener('mouseleave', () => {
                document.body.classList.remove('hovered');
            });

        });

        // AUDIO

        let audioStarted = false;

        function initAudio() {

            if (!audioStarted) {

                const audio = document.getElementById('bg-music');

                audio.volume = 0.12;
                audio.play();

                audioStarted = true;
            }
        }

    </script>

</body>
</html>
